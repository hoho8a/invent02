<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>발명 상자</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#FFE2DE;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#tools{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px 10px;background:#fff;border-bottom:3px solid #FFC9C2}
.grp{display:flex;gap:6px;align-items:center;padding:0 6px;border-left:2px solid #eee}
.grp:first-child{border-left:0}
button{font:inherit;font-size:18px;font-weight:700;min-height:52px;min-width:52px;padding:0 14px;border:0;border-radius:16px;background:#FFF0A8;color:#26233A;cursor:pointer}
button:active{transform:scale(.95)}
button.on{background:#FF7BAC;color:#fff}
button.go{background:#27BDA3;color:#fff}
button.warn{background:#FFD9BE}
.dot{min-width:46px;width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #ccc}
.dot.on{box-shadow:0 0 0 4px #26233A;background-clip:padding-box}
.hide{display:none!important}
#ver{font-size:12px;color:#999;margin-left:4px}
#view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1100px;height:570px;transform-origin:0 0;background:#fff;touch-action:none;overflow:hidden}
#bg{position:absolute;left:0;top:0}
#front{position:absolute;left:0;top:0;pointer-events:none}
#draw{position:absolute;left:0;top:0;width:1100px;height:570px;pointer-events:none;touch-action:none}
body.drawing #draw{pointer-events:auto;cursor:crosshair}
.item{position:absolute;left:-50px;top:-50px;width:100px;height:100px;touch-action:none;cursor:grab}
.item svg{width:100px;height:100px;display:block;pointer-events:none;overflow:visible}
body.drawing .item{pointer-events:none}
.frame{position:absolute;inset:-6px;border:calc(3px*var(--inv)) dashed #FF7BAC;pointer-events:none;display:none}
.item.sel .frame,.item.sel .h{display:block}
.h{position:absolute;display:none;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid #FF7BAC;font-size:22px;line-height:40px;text-align:center;transform:translate(-50%,-50%) scale(var(--inv));touch-action:none;font-weight:700;color:#FF7BAC}
.h.rot{left:50%;top:-36px}
.h.siz{left:106%;top:106%}
.h.del{left:-6%;top:-6%}
#exit{position:absolute;right:14px;top:14px;z-index:5}
body.present #tools{display:none}
body.present #view{background:#FFE2DE}
body.drawing .frame,body.drawing .h,body.present .frame,body.present .h{display:none!important}
body.present .item{pointer-events:none}
#exit{display:none}
body.present #exit{display:block}
</style>
</head>
<body>
<div id="app">
 <div id="tools">
  <div class="grp">
   <button id="mMove" class="on">👆 옮기기</button>
   <button id="mDraw">✏️ 그리기</button>
  </div>
  <div class="grp hide" id="drawTools">
   <button class="dot on" data-c="#26233A" style="background:#26233A"></button>
   <button class="dot" data-c="#E8423F" style="background:#E8423F"></button>
   <button class="dot" data-c="#FF9A1F" style="background:#FF9A1F"></button>
   <button class="dot" data-c="#F3C623" style="background:#F3C623"></button>
   <button class="dot" data-c="#3BB54A" style="background:#3BB54A"></button>
   <button class="dot" data-c="#2F7BE0" style="background:#2F7BE0"></button>
   <button class="dot" data-c="#8E4FD0" style="background:#8E4FD0"></button>
   <button id="bEr">🧽 지우개</button>
   <button id="bSize">굵기 ●</button>
   <button id="bUndo">↩ 되돌리기</button>
   <button id="bClr" class="warn">그림 지우기</button>
  </div>
  <div class="grp hide" id="selTools">
   <button id="bBig">➕ 크게</button>
   <button id="bSmall">➖ 작게</button>
   <button id="bRot">↻ 돌리기</button>
   <button id="bFront">⬆ 앞으로</button>
   <button id="bBack">⬇ 뒤로</button>
   <button id="bCopy">⧉ 복사</button>
   <button id="bDel" class="warn">🗑 빼기</button>
  </div>
  <div class="grp">
   <button id="bReset" class="warn">처음으로</button>
   <button id="bPres" class="go">📢 발표하기</button>
   <span id="ver">v13 발명 상자</span>
  </div>
 </div>

['microwave',95,215,1.0],['fridge',185,228,1.25],['vacuum',285,218,1.1],['bottle',455,100,0.75],['clock',530,95,0.7],
['keyboard',120,335,1.5],['bed',430,218,1.35],['apple',235,335,0.65],['pencil',345,335,1.25],['eraser',450,335,0.6],
['backpack',75,425,0.9],['pen',150,425,0.9],['fan',285,425,0.85],['umbrella',375,425,1.05],['cap',540,335,0.9],['chair',470,425,0.9],['toothbrush',215,425,1.05]];
/* ---------- 상태 ---------- */
var items=[],strokes=[],uid=1,sel=null,mode='move',color='#26233A',size=6,erase=false,k=1;
function def(){items=START.map(function(a){return {id:uid++,t:a[0],x:a[1],y:a[2],s:a[3],r:0}});strokes=[];sel=null}
function save(){try{localStorage.setItem(KEY,JSON.stringify({items:items,strokes:strokes,uid:uid}))}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.items){items=d.items;strokes=d.strokes||[];uid=d.uid||100;return true}}catch(e){}return false}
if(!load())def();
/* ---------- 그리기 ---------- */
var cv=$('draw'),cx=cv.getContext('2d');
function seg(st){cx.save();cx.scale(2,2);cx.lineCap='round';cx.lineJoin='round';cx.lineWidth=st.w;cx.globalCompositeOperation=st.e?'destination-out':'source-over';cx.strokeStyle=st.c;cx.fillStyle=st.c;var p=st.p;if(p.length==1){cx.beginPath();cx.arc(p[0][0],p[0][1],st.w/2,0,7);cx.fill()}else{cx.beginPath();cx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)cx.lineTo(p[i][0],p[i][1]);cx.stroke()}cx.restore()}
function redraw(){cx.clearRect(0,0,2200,1140);strokes.forEach(seg)}
/* ---------- 물건 ---------- */
var layer=$('items');
function tf(it){return 'translate('+it.x+'px,'+it.y+'px) rotate('+it.r+'deg) scale('+it.s+')'}
function build(){
 layer.innerHTML='';
 items.forEach(function(it){
  var d=document.createElement('div');d.className='item'+(it.id===sel?' sel':'');d.dataset.id=it.id;
  d.style.transform=tf(it);d.style.setProperty('--inv',1/it.s);
  d.innerHTML='<svg viewBox="0 0 100 100">'+ICONS[it.t]+'</svg><div class="frame"></div><div class="h rot">↻</div><div class="h siz">⤡</div><div class="h del">✕</div>';
  layer.appendChild(d);
 });
 tools();
}
function find(id){for(var i=0;i<items.length;i++)if(items[i].id==id)return items[i]}
function el(id){return layer.querySelector('[data-id="'+id+'"]')}
function upd(it){var d=el(it.id);if(d){d.style.transform=tf(it);d.style.setProperty('--inv',1/it.s)}}
function select(id){
 sel=id;
 
 build();
}
function tools(){$('selTools').classList.toggle('hide',sel==null||mode!='move');$('drawTools').classList.toggle('hide',mode!='draw')}
function pt(e){var r=$('stage').getBoundingClientRect();return {x:(e.clientX-r.left)/k,y:(e.clientY-r.top)/k,rect:r}}
/* 드래그 / 크기 / 각도 */
var act=null;
layer.addEventListener('pointerdown',function(e){
 if(mode!='move')return;
 var d=e.target.closest('.item');if(!d)return;
 var it=find(d.dataset.id),p=pt(e),h=e.target.closest('.h');
 e.preventDefault();e.stopPropagation();
 if(h&&h.classList.contains('del')){items.splice(items.indexOf(it),1);sel=null;build();save();return}
 if(sel!==it.id){select(it.id);d=el(it.id)}
 var type=h?(h.classList.contains('rot')?'rot':'siz'):'move';
 act={type:type,it:it,ox:p.x-it.x,oy:p.y-it.y,id:e.pointerId};
 try{d.setPointerCapture(e.pointerId)}catch(x){}
});
window.addEventListener('pointermove',function(e){
 if(!act||e.pointerId!==act.id)return;
 var p=pt(e),it=act.it;
 if(act.type=='move'){it.x=Math.max(0,Math.min(W,p.x-act.ox));it.y=Math.max(0,Math.min(H,p.y-act.oy))}
 else if(act.type=='rot'){it.r=Math.round((Math.atan2(p.y-it.y,p.x-it.x)*180/Math.PI+90)/3)*3}
 else{var dist=Math.hypot(p.x-it.x,p.y-it.y);it.s=Math.max(.3,Math.min(4,dist/66))}
 upd(it);
});
function end(e){if(act&&e.pointerId===act.id){act=null;save()}}
window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
$('stage').addEventListener('pointerdown',function(e){if(mode=='move'&&!e.target.closest('.item')&&sel!=null){sel=null;build()}});
/* 그리기 이벤트 */
var cur=null;
cv.addEventListener('pointerdown',function(e){
 if(mode!='draw')return;e.preventDefault();
 var p=pt(e);cur={c:color,w:erase?size*3:size,e:erase,p:[[p.x,p.y]]};strokes.push(cur);
 try{cv.setPointerCapture(e.pointerId)}catch(x){}redraw();
});
cv.addEventListener('pointermove',function(e){if(!cur)return;var p=pt(e);cur.p.push([p.x,p.y]);redraw()});
function dend(){if(cur){cur=null;save()}}
cv.addEventListener('pointerup',dend);cv.addEventListener('pointercancel',dend);
/* ---------- 버튼 ---------- */
function setMode(m){mode=m;document.body.classList.toggle('drawing',m=='draw');$('mMove').classList.toggle('on',m=='move');$('mDraw').classList.toggle('on',m=='draw');build()}
$('mMove').onclick=function(){setMode('move')};$('mDraw').onclick=function(){setMode('draw')};
var dots=document.querySelectorAll('.dot');
dots.forEach(function(b){b.onclick=function(){dots.forEach(function(x){x.classList.remove('on')});b.classList.add('on');color=b.dataset.c;erase=false;$('bEr').classList.remove('on')}});
$('bEr').onclick=function(){erase=!erase;this.classList.toggle('on',erase)};
var sizes=[4,8,14],si=1;size=sizes[si];
$('bSize').onclick=function(){si=(si+1)%3;size=sizes[si];this.textContent='굵기 '+['·','●','⬤'][si]};
$('bUndo').onclick=function(){strokes.pop();redraw();save()};
var t1;$('bClr').onclick=function(){var b=this;if(b.dataset.ask){strokes=[];redraw();save();b.textContent='그림 지우기';delete b.dataset.ask;return}b.dataset.ask=1;b.textContent='정말 지울까요?';clearTimeout(t1);t1=setTimeout(function(){b.textContent='그림 지우기';delete b.dataset.ask},3000)};
function selIt(){return sel!=null?find(sel):null}
$('bBig').onclick=function(){var it=selIt();if(it){it.s=Math.min(4,it.s*1.2);upd(it);save()}};
$('bSmall').onclick=function(){var it=selIt();if(it){it.s=Math.max(.3,it.s/1.2);upd(it);save()}};
$('bRot').onclick=function(){var it=selIt();if(it){it.r=(it.r+15)%360;upd(it);save()}};
$('bFront').onclick=function(){var it=selIt();if(it){items.splice(items.indexOf(it),1);items.push(it);build();save()}};
$('bBack').onclick=function(){var it=selIt();if(it){items.splice(items.indexOf(it),1);items.unshift(it);build();save()}};
$('bCopy').onclick=function(){var it=selIt();if(it){var n={id:uid++,t:it.t,x:Math.min(W,it.x+40),y:Math.min(H,it.y+40),s:it.s,r:it.r};items.push(n);select(n.id);save()}};
$('bDel').onclick=function(){var it=selIt();if(it){items.splice(items.indexOf(it),1);sel=null;build();save()}};
var t2;$('bReset').onclick=function(){var b=this;if(b.dataset.ask){def();redraw();build();save();b.textContent='처음으로';delete b.dataset.ask;return}b.dataset.ask=1;b.textContent='정말 처음부터?';clearTimeout(t2);t2=setTimeout(function(){b.textContent='처음으로';delete b.dataset.ask},3000)};
/* 발표하기 */
$('bPres').onclick=function(){sel=null;setMode('move');document.body.classList.add('present');build();fit();
 try{var r=document.documentElement;(r.requestFullscreen||r.webkitRequestFullscreen).call(r)}catch(x){}};
$('exit').onclick=function(){document.body.classList.remove('present');try{if(document.fullscreenElement)document.exitFullscreen()}catch(x){}fit()};
/* 화면 맞추기 */
function fit(){
 var v=$('view'),aw=v.clientWidth,ah=v.clientHeight;k=Math.min(aw/W,ah/H);
 var w=$('wrap');w.style.width=W*k+'px';w.style.height=H*k+'px';$('stage').style.transform='scale('+k+')';
}
window.addEventListener('resize',fit);document.addEventListener('fullscreenchange',function(){setTimeout(fit,100)});
build();redraw();fit();setTimeout(fit,200);
})();
</script>
</body>
</html>
